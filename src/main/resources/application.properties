spring.application.name=TestTEch
spring.datasource.url=jdbc:h2:mem:countries;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
world-bank.base-url=${WORLD_BANK_BASE_URL:https://api.worldbank.org/v2}
world-bank.connect-timeout=${WORLD_BANK_CONNECT_TIMEOUT:3s}
world-bank.read-timeout=${WORLD_BANK_READ_TIMEOUT:5s}
springdoc.paths-to-match=/api/countries/**
springdoc.override-with-generic-response=false
